<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompts compartidos — KookyeCatCloud</title>
<meta name="theme-color" content="#070b16">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--bg:#070b16;--bg-deep:#04070f;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.16);
    --text:#eaf0ff;--muted:#a3b0cf;--faint:#6d7c9e;--b1:#4f7cff;--b2:#a855f7;--brand:linear-gradient(135deg,var(--b1),var(--b2));
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;}
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;min-height:100dvh;font-family:var(--font);background:radial-gradient(120% 90% at 50% 0%,#0d1730 0%,var(--bg) 45%,var(--bg-deep) 100%);
    color:var(--text);font-size:15px;line-height:1.5;padding:24px 16px 60px;-webkit-font-smoothing:antialiased;}
  main{max-width:760px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:var(--faint);font-size:13px;margin:0 0 22px;}
  .card{border:1px solid var(--line-2);border-radius:18px;background:linear-gradient(170deg,rgba(255,255,255,.08),rgba(255,255,255,.025));padding:18px;margin-bottom:16px;}
  .card h2{font-size:17px;margin:0 0 4px;}
  .meta{color:var(--faint);font-size:12.5px;margin:0 0 12px;}
  .blk{margin-top:12px;}
  .blk header{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  pre{margin:0;padding:12px;border-radius:12px;background:rgba(4,7,15,.65);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;max-height:420px;overflow:auto;}
  button{font:inherit;font-size:12.5px;color:var(--text);background:var(--glass);border:1px solid var(--line-2);border-radius:10px;padding:6px 12px;cursor:pointer;min-height:36px;}
  button.p{background:var(--brand);border-color:transparent;}
  .err{text-align:center;padding:60px 10px;color:var(--muted);}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;} dt{color:var(--faint);}
  footer{margin-top:30px;text-align:center;color:var(--faint);font-size:12px;}
</style>
</head>
<body>
<main>
  <div id="cargando" class="err">Cargando…</div>
  <div id="error" class="err" hidden></div>
  <div id="contenido" hidden>
    <h1 id="titulo"></h1>
    <p class="sub" id="sub"></p>
    <div id="lista"></div>
    <footer>Compartido con KookyeCatCloud · solo lectura</footer>
  </div>
</main>
<script src="/prompts-share.js"></script>
</body>
</html>
